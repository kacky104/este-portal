<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="0.55" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="292" height="412" rx="26" fill="url(#g)"/>
  <rect x="4" y="4" width="292" height="412" rx="26" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- 紙吹雪 -->
  <g opacity="0.9">
    <circle cx="34" cy="40" r="5" fill="#FDE047"/>
    <circle cx="268" cy="54" r="4" fill="#fff"/>
    <rect x="248" y="22" width="9" height="9" rx="2" fill="#FDE047" transform="rotate(25 252 26)"/>
    <rect x="44" y="120" width="8" height="8" rx="2" fill="#fff" transform="rotate(-20 48 124)"/>
    <circle cx="262" cy="132" r="5" fill="#FEF08A"/>
    <path d="M22 78l6 10 6-10z" fill="#fff" opacity="0.8"/>
  </g>
  <text x="150" y="44" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#fff" opacity="0.95">FUKUES MEMBER</text>
  <text x="150" y="92" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="40" font-weight="900" fill="#fff" stroke="#BE185D" stroke-width="1.2" paint-order="stroke">フクエス会員</text>
  <text x="150" y="146" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="46" font-weight="900" fill="#FDE047" stroke="#9D174D" stroke-width="2.4" paint-order="stroke">募集中!!</text>
  <!-- ポイント3つ -->
  <g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-weight="900">
    <rect x="26" y="170" width="248" height="44" rx="22" fill="#fff"/>
    <circle cx="50" cy="192" r="13" fill="#DB2777"/>
    <text x="50" y="198" text-anchor="middle" font-size="15" fill="#fff">1</text>
    <text x="72" y="199" font-size="19" fill="#9D174D">登録は約<tspan fill="#DB2777" font-size="23">1分</tspan>・無料</text>

    <rect x="26" y="224" width="248" height="44" rx="22" fill="#fff"/>
    <circle cx="50" cy="246" r="13" fill="#DB2777"/>
    <text x="50" y="252" text-anchor="middle" font-size="15" fill="#fff">2</text>
    <text x="72" y="253" font-size="18" fill="#9D174D">メールアドレスだけ</text>

    <rect x="26" y="278" width="248" height="44" rx="22" fill="#fff"/>
    <circle cx="50" cy="300" r="13" fill="#DB2777"/>
    <text x="50" y="306" text-anchor="middle" font-size="15" fill="#fff">3</text>
    <text x="72" y="307" font-size="18" fill="#9D174D">ポイントが<tspan fill="#DB2777" font-size="21">貯まる</tspan></text>
  </g>
  <!-- ボタン -->
  <rect x="46" y="340" width="208" height="50" rx="25" fill="#9D174D" opacity="0.35" transform="translate(0 4)"/>
  <rect x="46" y="340" width="208" height="50" rx="25" fill="url(#btn)"/>
  <text x="150" y="372" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="19" font-weight="900" fill="#9D174D">くわしく見る ▶</text>
</svg>
