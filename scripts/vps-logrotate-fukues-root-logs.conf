# /etc/logrotate.d/fukues-root-logs  (VPS: ConoHa 160.251.174.184)
# Source of truth: este-portal/scripts/vps-logrotate-fukues-root-logs.conf (the VPS file is a copy).
# Rotates the cron logs under /root once a month, keeps 12 months, gzips all but the latest one.
# No copytruncate: every writer is a short cron run using ">>", so a plain rename loses no lines.
/root/*.log {
    monthly
    maxsize 200M
    rotate 12
    dateext
    compress
    delaycompress
    nocreate
    missingok
    notifempty
}
